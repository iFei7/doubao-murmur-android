# JVM settings for the build itself (not for the app runtime).
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# Parallel + build cache are safe for this project layout.
org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache is intentionally disabled for now: the detekt 1.23 Gradle plugin and the
# com.android.test (macrobenchmark) variant resolution still hit configuration-cache problems.
# Re-enable (org.gradle.configuration-cache=true) once detekt fails are resolved.
org.gradle.configuration-cache=false

# AndroidX / R classes
android.useAndroidX=true
android.nonTransitiveRClass=true

# BuildConfig is opt-in per module (only :app needs it).
android.defaults.buildfeatures.buildconfig=false

kotlin.code.style=official
